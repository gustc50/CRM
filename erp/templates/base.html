<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Pequenas Empresas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Gestão Financeira</h1>

        <nav class="tabs">
            <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index', 'editar') else '' }}">Lançamentos</a>
            <a href="{{ url_for('relatorio') }}" class="{{ 'active' if request.endpoint == 'relatorio' else '' }}">Relatório por Período</a>
        </nav>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <ul class="flashes">
                {% for categoria, mensagem in messages %}
                <li class="{{ categoria }}">{{ mensagem }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
