{% extends 'base.html' %}

{% block content %}
<h2>Editar Categoria</h2>

<form action="{{ url_for('categorias_editar', id=registro.id) }}" method="POST" class="form-coluna">
    <label>
        Nome
        <input type="text" name="nome" value="{{ registro.nome }}" maxlength="50" required>
    </label>

    <label>
        Tipo
        <select name="tipo" required>
            <option value="Pagar" {{ 'selected' if registro.tipo == 'Pagar' else '' }}>Contas a Pagar</option>
            <option value="Receber" {{ 'selected' if registro.tipo == 'Receber' else '' }}>Contas a Receber</option>
        </select>
    </label>

    <label>
        Centro de custo (opcional)
        <input type="text" name="centro_custo" value="{{ registro.centro_custo or '' }}" maxlength="80">
    </label>

    <div class="form-acoes">
        <button type="submit">Salvar Alterações</button>
        <a href="{{ url_for('categorias_listar') }}" class="btn-acao btn-cancelar">Cancelar</a>
    </div>
</form>
{% endblock %}
