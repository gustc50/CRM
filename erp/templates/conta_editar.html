{% extends 'base.html' %}

{% block content %}
<h2>Editar banco</h2>

{% set v = valores_do_formulario(f, registro, ('nome', 'banco', 'agencia', 'conta_numero')) %}
<form action="{{ url_for('contas_editar', id=registro.id) }}" method="POST" class="form-coluna">
    <label>
        Nome
        <input type="text" name="nome" value="{{ v.nome }}" maxlength="80" required>
    </label>

    <label>
        <span>Banco <small>(opcional)</small></span>
        <select name="banco">
            <option value="">Nenhum (caixa)</option>
            {% for codigo, nome in BANCOS_BRASIL %}
            <option value="{{ codigo }}" {{ 'selected' if v.banco == codigo else '' }}>{{ nome }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Agência <small>(opcional)</small></span>
        <input type="text" name="agencia" value="{{ v.agencia }}" maxlength="20" inputmode="numeric">
    </label>

    <label>
        <span>Número da conta <small>(opcional)</small></span>
        <input type="text" name="conta_numero" value="{{ v.conta_numero }}" maxlength="30">
    </label>

    <div class="form-acoes">
        <button type="submit">Salvar alterações</button>
        <a href="{{ url_for('contas_listar') }}" class="btn-secundario btn-link">Cancelar</a>
    </div>
</form>
{% endblock %}
