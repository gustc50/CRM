{% extends 'base.html' %}

{% block content %}
<h2>Editar {{ titulo_singular }}</h2>

<form action="{{ url_for(prefixo + '_editar', id=registro.id) }}" method="POST" class="form-coluna">
    <label>
        CNPJ/CPF
        <input type="text" name="cnpj_cpf" value="{{ formatar_cnpj_cpf(registro.cnpj_cpf) }}" maxlength="20" required>
    </label>

    <label>
        Nome
        <input type="text" name="nome" value="{{ registro.nome }}" maxlength="150" required>
    </label>

    <label>
        Endereço
        <input type="text" name="endereco" value="{{ registro.endereco }}" maxlength="200" required>
    </label>

    <label>
        Telefone (opcional)
        <input type="text" name="telefone" value="{{ registro.telefone or '' }}" maxlength="20">
    </label>

    <label>
        E-mail (opcional)
        <input type="email" name="email" value="{{ registro.email or '' }}" maxlength="150">
    </label>

    <label>
        Categoria padrão (opcional)
        <select name="categoria_id">
            <option value="">Nenhuma</option>
            {% for c in categorias %}
            <option value="{{ c.id }}" {{ 'selected' if registro.categoria_id == c.id else '' }}>{{ c.nome }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Conta bancária padrão (opcional)
        <select name="conta_bancaria_id">
            <option value="">Nenhuma</option>
            {% for c in contas_bancarias %}
            <option value="{{ c.id }}" {{ 'selected' if registro.conta_bancaria_id == c.id else '' }}>{{ c.nome }}</option>
            {% endfor %}
        </select>
    </label>

    <div class="form-acoes">
        <button type="submit">Salvar Alterações</button>
        <a href="{{ url_for(prefixo + '_listar') }}" class="btn-acao btn-cancelar">Cancelar</a>
    </div>
</form>
{% endblock %}
