{% extends 'base.html' %}

{% block content %}
<h2>{{ titulo }}</h2>

<form action="{{ url_for(prefixo + '_adicionar') }}" method="POST">
    <input type="text" name="cnpj_cpf" placeholder="CNPJ ou CPF" maxlength="20" required>
    <input type="text" name="nome" placeholder="Nome" maxlength="150" required>
    <input type="text" name="endereco" placeholder="Endereço" maxlength="200" required>
    <button type="submit">Adicionar {{ titulo_singular }}</button>
</form>

<table>
    <thead>
        <tr>
            <th>CNPJ/CPF</th>
            <th>Nome</th>
            <th>Endereço</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody>
        {% for r in registros %}
        <tr>
            <td>{{ r.cnpj_cpf }}</td>
            <td>{{ r.nome }}</td>
            <td>{{ r.endereco }}</td>
            <td class="acoes">
                <a href="{{ url_for(prefixo + '_editar', id=r.id) }}" class="btn-acao btn-editar">Editar</a>
                <form action="{{ url_for(prefixo + '_excluir', id=r.id) }}" method="POST" class="form-inline"
                      onsubmit="return confirm('Excluir \'{{ r.nome }}\'? Essa ação não pode ser desfeita.');">
                    <button type="submit" class="btn-acao btn-excluir">Excluir</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">Nenhum {{ titulo_singular|lower }} cadastrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
